<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Pesquisa Senaitec</title>
</head>
<body>
    <main>

        <header> 
            <img src="./img/logo.png" alt="Logo Senaitec" width="200px" height="200px">
            <h1> Pesquisa Senaitec</h1>
        </header>
            
        <section> 
            <form action="index.html" method="get">
            
            <!--dados pessoais-->
            <fieldset> 
                <legend>Dados Pessoais</legend>

                <label for="userName">Nome:</label>
                    <input type="text" name="userName" id="userName" required>
                        <br>
            
                <label for="userAge">Idade:</label>
                    <input type="number" name="userAge" id="userAge" required min="12" max="120">
                        <br>

                <label for="userBirthDate">Data de Nascimento:</label>
                    <input type="date" name="userBirthDate" id="userBirthDate">
                        <br>

                <label for="userEmail">E-mail:</label>
                    <input type="email" name="userEmail" id="userEmail" required>
                        <br>

                <label for="userPhone">Telefone:</label>
                    <input type="tel" name="userPhone" id="userPhone" pattern=" [0-9]{11}" placeholder="21987554321"> 
                        <br>

                <label for="userImage">Upload de foto:</label>
                    <input type="file" name="userImage" id="userImage">
                        <br>
                
            </fieldset>

            <!--informações-->
            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero</p>

                <input type="radio" name="userGender" id="userGender1" value="masculino">
                <label for="userGender1">Masculino</label>
                <br>

                <input type="radio" name="userGender" id="userGender2" value="feminino">
                <label for="userGender2">Feminino</label>
                <br>

                <input type="radio" name="userGender" id="userGender3" value="outro">
                <label for="userGender3">Prefiro não informar</label>
                <br>

                <label for="userMaritalStatus">Estado Civil</label>
                <select name="userMaritalStatus" id="userMaritalStatus">
                    <option value="">Selecione...</option>
                    <option value="">Solteiro(a)</option>
                    <option value="">Casado(a)</option>
                    <option value="">Divorciado(a)</option>
                    <option value="">Viuvo(a)</option>
                    <option value="">União Estatável</option>
                </select>
                <br>


                <label for="userUf">Estado</label>
                <select name="userState" id="userState">
                    <option value="">Selecione...</option>
                    <option value="AC">Acre</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="PA">Pará</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="TO">Tocantins</option>
                    <option value="AL">Alagoas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="MA">Maranhão</option>
                    <option value="PB">Paraíba</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="SE">Sergipe</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="GO">Goiás</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">São Paulo</option>
                    <option value="PR">Paraná</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="SC">Santa Catarina</option>
                </select>
                <br>

                <label for="userCity">Cidade:</label>
                <input type="text" name="userCity" id="userCity" placeholder="Fortaleza">                
            </fieldset>

            <!--redes sociais/estilo musical/cor favorita-->
            <fieldset>
                <legend>Hábitos</legend>
                <p>Redes sociais</p>

                <input type="checkbox" name="userSocial" id="userSocial1" value="instagram">
                <label for="userSocial1">Instagram:</label>
                <br>

                <input type="checkbox" name="userSocial" id="userSocial2" value="facebook">
                <label for="userSocial2">Facebook:</label>
                <br>

                <input type="checkbox" name="userSocial" id="userSocial3" value="whatsapp">
                <label for="userSocial3">Whatsapp:</label>
                <br>

                <!--estilo musical-->
                <label for="userMusicStyle">Estilo Musical:</label>
                <input type="text" name="userMusicStyle" id="userMusicStyle" list="opcoes-estilos">
                    <datalist id="opcoes-estilos">
                        <option value="Rock"></option>
                        <option value="Pop"></option>
                        <option value="Sertanejo"></option>
                        <option value="Funk"></option>
                        <option value="Pagode"></option>
                        <option value="Forró"></option>
                    </datalist>

                <!--cor favorita-->
                <label for="userFavoriteColor">Cor Favorita:</label>
                <input type="color" name="userFavoriteColor" id="userFavoriteColor">
           

            </fieldset>


            <!--fieldset safisfação-->
            <fieldset>
                <legend>Satisfação</legend>

                <p>Nível de satisfação com a SenaiTec:</p>
                <input type="radio" name="userSatisfaction" id="userSatisfaction1" value="otima">
                <label for="userSatisfaction1">Ótimo</label>
                <br>
                
                <input type="radio" name="userSatisfaction" id="userSatisfaction2" value="boa">
                <label for="userSatisfaction2">Bom</label>
                <br>

                <input type="radio" name="userSatisfaction" id="userSatisfaction3" value="regular">
                <label for="userSatisfaction3">Regular</label>
                <br>

                <input type="radio" name="userSatisfaction" id="userSatisfaction4" value="ruim">
                <label for="userSatisfaction4">Ruim:</label>
                <br>

                <label for="userComment">Deixe seu comentário</label>
                <textarea name="userComment" id="userComment"></textarea>
            </fieldset>

            
            <fieldset>
                <legend>Confirmações</legend>

                <input type="checkbox" name="" id="userLGPD" value="lgpd" required>
                <label for="userLGPD">Eu aceito participar da Pesquisa</label>
                <br>

                <input type="checkbox" name="userConfirmEmail" id="userConfirmEmail"value=email>
                <label for="userConfirmEmail">Desejo receber os resultados por email</label>
                <br>

            <fieldset>

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>

        </form>
    </section>
</main>
</body>
</html>
